output_dir: /home/spolitan/alice/dplus_v2_pp/111026/outputs/pp_020  # Output directory for all results. Will be created if it does not exist.

# Common SE/ME axis indices from your diagnostic. Their bin edges may differ.
axes:
  multiplicity: null  # These inputs have no separate multiplicity axis.
  pool: 0
  pt_cand: 1
  pt_assoc: 2
  delta_eta: 3
  delta_phi: 4
  mass: 5
  bdt_background: 6
  bdt_prompt: 7

mass_axes:
  mass: 0
  pt_cand: 1
  bdt_background: 2
  bdt_prompt: 3

multiplicity_label: pp_020  # Label of the existing input selection; no new cut.

bins:
  multiplicity: null
  pt_cand: [1, 2, 3, 4, 6, 8, 10]
  pt_assoc: [0.3, 3.0]

# Integrate extra regular-bin axes. No additional BDT cut in this example.
# To select BDT: use {axis: bdt_prompt, ranges: [0.2, 1.0]}.
# Numeric indices remain supported; verify BDT names/indices for your input.
# Or ranges: [[low1, high1], ..., [low5, high5]] for candidate-pT-dependent cuts.
# All requested edges must already exist on the input axes.
preprocess:
  keep_axes: [pool, mass, delta_eta, delta_phi, bdt_prompt] # Keep all relevant axes in THIS ORDER. pt_cand, pt_assoc, multiplicity are integrated out
  rebin: {mass: 2, delta_eta: 1, delta_phi: 2}
  cuts: [
    {axis: bdt_prompt, ranges: [0., 1.0]},
    {axis: bdt_background, ranges: [0., 0.1]},
    #{axis: pool, ranges: [3., 20.]},
    #{axis: delta_eta, ranges: [0.8, 1.6]}
  ]

correlation:
  mass_bins:
  mass_bins:
    - 1.72
    - 1.76
    - 1.80
    - 1.84
    - 1.86
    - 1.88
    - 1.90
    - 1.92
    - 1.94
    - 1.96
    - 2.00
  save_pdf: true               # correlation maps
  pdf_draw_option: "SURF1"      # optional; "SURF1" / "LEGO2" also work

deltaphi:
  delta_eta_ranges:
    - [-1.4, -1.]
    - [1., 1.4]

  fit_range: [1.72, 2.08]

  mass_fit:
    signal: gaus
    background: [pol3, expo, expo, expo, expo, expo, expo, expo, expo, expo, expo, expo]

    initial_parameters:
      Mean:  [1.869, 1.82, 1.92]
      Sigma: [0.012, 0.003, 0.040]

  fail_on_bad_fit: true
  save_pdf: true

fourier:
  is_lm: true
  delta_eta_ranges:
    - [-1.4, -1.0]
    - [1.0, 1.4]
  lm_file: /home/spolitan/alice/dplus_v2_pp/111026/outputs/pp_60100/fourier/
  # opzionale; se assente usa tutto il range di Δφ
  fit_range: [-1.57079632679, 4.71238898038]
  save_pdf: true               # Fourier fits
  systematics:
    dosyst: false
    vary_fit_range: false
    vary_delta_eta_ranges: false
    vary_lm: false

Dmeson: Dplus
simultaneous_fit:
  Sigma: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
  MassFitRanges:
    - [1.78, 1.96]
    - [1.78, 1.96]
    - [1.76, 1.98]
    - [1.76, 1.98]
    - [1.76, 1.98]
    - [1.76, 2.00]
  BkgFunc: [kExpo, kExpo, kExpo, kExpo, kExpo, kLin]
  SgnFunc: kGaus
  BkgFuncVn: [kLin, kLin, kLin, kLin, kLin, kLin]
  Rebin: 6
  InclSecPeak: 0
  SigmaSecPeak: [0.01, 0.01, 0.02, 0.01, 0.01, 0.02]
  FixMean: 1
  FixSigma: 0
  NSigma4SB: 3
  harmonic: 2
  save_pdf: true
  # Choose exactly ONE v2HH input mode.
  # A) fixed V_{2Delta}^{h-h}: no uncertainty is assigned to v2HH
  # v2HH: 0.055
  # B) ROOT input: value and uncertainty are read vs associated-track pT
  v2HH: 0.07
  # file: /path/to/v2hh.root
  # object: hV2HH

efficiency:
  # Optional: if you have a separate efficiency histogram, specify it here.
  # file: /path/to/efficiency.root
  # histogram: hEfficiency

fraction:
  # Optional: if you have a separate prompt fraction histogram, specify it here.
  # file: /path/to/prompt_fraction.root
  # histogram: hPromptFraction
  # systematics
  #   dosyst: false

jetshape:
  delta_phi_range: [-0.1963495408, 0.1963495408]
  # range in DeltaEta used for the fit
  fit_range: [-0.4, 0.4]
  # optional initial values / limits
  mean_initial: 0.0
  mean_limits: [-0.5, 0.5]
  sigma_initial: 0.4
  sigma_limits: [0.02, 10000.0]
  beta_initial: 2.0
  beta_limits: [0.5, 10.0]
  save_pdf: true  

# Enable only if the input is known to contain unweighted counts without Sumw2.
allow_poisson_errors: true
